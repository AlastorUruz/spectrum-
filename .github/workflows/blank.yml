# name: Compilar APK de Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecutar el build manualmente desde la web de GitHub

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Configurar Java JDK (necesario para compilar Android)
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Instalar las dependencias de tu proyecto
      - name: Instalar dependencias de npm
        run: npm install

      # 5. Compilar el código web (Vite / HTML / JS)
      - name: Compilar proyecto Web
        run: npm run build

      # 6. Agregar/Sincronizar la plataforma Android con Capacitor
      - name: Sincronizar Capacitor con Android
        run: |
          npx cap add android || true
          npx cap sync android

      # 7. Dar permisos de ejecución al ejecutable de Gradle
      - name: Asignar permisos a Gradle
        run: chmod +x android/gradlew

      # 8. Compilar el archivo APK (Modo Debug/Prueba)
      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      # 9. Guardar y subir el APK generado como artefacto descargable
      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: App-Espectrograma-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
